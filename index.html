<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a18">
<title>Field Notes</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#1a1a18;--card:#242420;--bdr:#333330;--txt:#e8dfd1;--mut:#a89a86;--gld:#c8b590;--grn:#6b8f5e;--blu:#5a8ab5;--amb:#d4a05a;--red:#c46b6b;--plm:#b07090;--sf:'Source Serif 4',Georgia,serif;--sn:'DM Sans',Helvetica,sans-serif}
body{background:var(--bg);color:var(--txt);font-family:var(--sn);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:var(--sn);cursor:pointer;border:none;background:none;color:inherit}input{font-family:var(--sn)}
.app{max-width:500px;margin:0 auto;padding:20px 16px 100px}
.tabs{display:flex;gap:4px;margin:16px 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 12px;border-radius:20px;font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap;flex-shrink:0}.tab.on{background:var(--gld);color:var(--bg);font-weight:700}
.cd{background:var(--card);border-radius:12px;padding:16px;margin-bottom:10px}
.lb{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.sl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin:18px 0 10px}
.pg{display:none}.pg.on{display:block}
.ck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--bdr)}.ck.done{border-color:var(--grn)}
.ck .bx{width:26px;height:26px;border-radius:7px;background:var(--bdr);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}.ck.done .bx{background:var(--grn)}
.wb{display:flex;gap:3px}.ws{flex:1;height:5px;border-radius:3px;background:var(--bdr)}.ws.f{background:var(--blu)}
.pb{display:flex;gap:3px}.ps{flex:1;height:4px;border-radius:2px;background:var(--bdr)}.ps.f{background:var(--grn)}
.chart-svg{width:100%;overflow:visible}
</style>
</head>
<body>
<div class="app" id="app">Loading...</div>
<script src="app.js"></script>
</body>
</html>
