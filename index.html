function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const [k,v] of Object.entries(attrs)) {
      if (k === "class") e.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
      else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "html") e.innerHTML = v;
      else e.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return e;
}

function div(attrs, ...children) { return el("div", attrs, ...children); }
function span(attrs, ...children) { return el("span", attrs, ...children); }
function btn(attrs, ...children) { return el("button", attrs, ...children); }
function inp(attrs) { return el("input", attrs); }

// ── TABS ───────────────────────────────────────────────────────────────────

let activeTab = "today";
let activeDate = TODAY();

const TABS = [
  { id:"today", label:"Today" },
  { id:"log", label:"Log" },
  { id:"suggest", label:"Suggest" },
  { id:"progress", label:"Progress" },
  { id:"plan", label:"Plan" },
];

// ── TODAY VIEW ─────────────────────────────────────────────────────────────

function renderToday() {
  const day = getDay(activeDate);
  const consumed = day.foods.reduce((s,f)=>s+f.c,0);
  const burned = day.exercises.reduce((s,e)=>s+e.c,0);
  const net = consumed - burned;
  const target = calTarget(day.drankLastNight);
  const protein = day.foods.reduce((s,f)=>s+(f.p||0),0);

  // Fasting window
  const now = new Date();
  const h = now.getHours() + now.getMinutes()/60;
  const isActiveDate = activeDate === TODAY();
  const windowOpen = h >= 10 && h < 18;
  const minsToOpen = !windowOpen && h < 10 ? Math.round((10-h)*60) : null;
  const minsToClose = windowOpen ? Math.round((18-h)*60) : null;

  let fastEl = null;
  if (isActiveDate) {
    const msg = windowOpen
      ? `Eating window open — closes in ${minsToClose}m (6:00 PM)`
      : h >= 18 ? "Window closed for the night. Fast until 10 AM."
      : `Fasting — window opens in ${minsToOpen}m (10:00 AM)`;
    fastEl = div({ class: windowOpen ? "fasting-open" : "fasting-closed" }, msg);
  }

  // Date strip
  const dates = [];
  const d = new Date();
  for (let i=0;i<14;i++) {
    dates.push(d.toISOString().split("T")[0]);
    d.setDate(d.getDate()-1);
  }
  const dateStrip = div({ class:"date-strip" }, ...dates.map(dt => {
    const isAct = dt === activeDate;
    const isTod = dt === TODAY();
    const b = btn({
      class: "date-btn" + (isAct?" active":"") + (!isAct&&isTod?" today":""),
      onClick: () => { activeDate = dt; render(); }
    }, isTod ? "Today" : new Date(dt+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"}));
    return b;
  }));

  // Cal bar
  const pct = Math.min(100, Math.round((net/target)*100));
  const over = net > target;
  const col = over ? T.danger : pct > 85 ? T.accent : T.good;
  const protPct = Math.min(100, Math.round((protein/PROTEIN_TARGET)*100));
  const protOk = protein >= PROTEIN_TARGET;
  const protClose = protein >= PROTEIN_TARGET*0.75;
  const protCol = protOk ? T.good : protClose ? T.accent : T.danger;

  const calBar = div({},
    div({ style:{ display:"flex", justifyContent:"space-between", marginBottom:"6px" }},
      span({}, el("b",{style:{fontSize:"22px",color:col}},net), span({style:{fontSize:"13px",color:T.muted}},` / ${target} net cal`)),
      span({style:{fontSize:"13px",color:T.good}},`−${burned} burned`)
    ),
    div({style:{height:"10px",borderRadius:"5px",background:T.border,overflow:"hidden",marginBottom:"4px"}},
      div({style:{height:"100%",borderRadius:"5px",background:col,width:pct+"%",transition:"width 0.4s"}})
    ),
    div({style:{display:"flex",justifyContent:"space-between",marginBottom:"14px"}},
      span({style:{fontSize:"11px",color:T.muted}},`Eaten: ${consumed}`),
      span({style:{fontSize:"11px",fontWeight:"600",color:over?T.danger:T.good}},
        over ? `${net-target} over` : `${target-net} remaining`)
    ),
    div({style:{display:"flex",justifyContent:"space-between",marginBottom:"5px"}},
      span({style:{fontSize:"12px",color:T.textMid,fontWeight:"500"}},"Protein"),
      span({style:{fontSize:"12px",fontWeight:"600",color:protCol}},`${protein}g`,
        span({style:{fontWeight:"400",color:T.muted}},` / ${PROTEIN_TARGET}g target`))
    ),
    div({style:{height:"8px",borderRadius:"4px",background:T.border,overflow:"hidden"}},
      div({style:{height:"100%",borderRadius:"4px",background:protCol,width:protPct+"%",transition:"width 0.4s"}})
    ),
    div({style:{marginTop:"4px",fontSize:"11px",color:protCol,fontWeight:protOk?"600":"400"}},
      protOk ? "✓ Protein target hit" : `${PROTEIN_TARGET-protein}g to go — aim for protein at every meal`)
  );

  // Check-in card
  const weightInput = inp({ type:"number", value:day.weight||"", placeholder:"lbs",
    style:{width:"100%",padding:"9px 12px",border:`1px solid ${T.border}`,borderRadius:"8px",fontSize:"14px",background:T.card,color:T.text,outline:"none"},
    onInput: e => updateDay(activeDate, d2 => { d2.weight = parseFloat(e.target.value)||null; })
  });
  const toggleBtn = btn({
    class:"toggle"+(day.drankLastNight?" on":""),
    onClick: () => updateDay(activeDate, d2 => { d2.drankLastNight = !d2.drankLastNight; })
  }, div({class:"toggle-knob"}));

  const checkin = div({ class:"card" },
    div({ class:"card-title" }, "Morning Check-in"),
    el("label",{class:"label"},"Weight today (lbs)"),
    weightInput,
    div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:"14px"}},
      div({},
        div({style:{fontSize:"14px",fontWeight:"500"}},"Drank last night?"),
        div({style:{fontSize:"12px",color:T.muted,marginTop:"2px"}},
          day.drankLastNight ? `+${calTarget(true)-calTarget(false)} cal target today` : "No adjustment")
      ),
      toggleBtn
    )
  );

  // Goal progress
  const s = state.settings;
  const cw = day.weight || s.startWeight;
  const totalLoss = s.startWeight - s.goalWeight;
  const achieved = s.startWeight - cw;
  const pctDone = totalLoss > 0 ? Math.min(100,Math.round((achieved/totalLoss)*100)) : 0;
  const goalCard = div({class:"card"},
    div({class:"card-title"},"Goal Progress"),
    div({style:{display:"flex",justifyContent:"space-between",fontSize:"12px",color:T.muted,marginBottom:"6px"}},
      span({},"Start: "+s.startWeight),
      span({style:{color:T.accent,fontWeight:"600"}},"Month: "+s.monthGoalWeight),
      span({},"Goal: "+s.goalWeight)
    ),
    div({style:{height:"10px",borderRadius:"5px",background:T.border,overflow:"hidden",marginBottom:"6px"}},
      div({style:{height:"100%",borderRadius:"5px",background:T.good,width:pctDone+"%",transition:"width 0.4s"}})
    ),
    div({style:{textAlign:"center",fontSize:"13px",color:T.textMid}},
      el("b",{},cw+" lbs"), ` — ${achieved > 0 ? achieved+" lbs lost" : "starting weight"} (${pctDone}% to goal)`)
  );

  // Food log
  const foodRows = day.foods.map((f,i) =>
    div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",
      borderBottom:i<day.foods.length-1?`1px solid ${T.border}`:"none"}},
      span({style:{fontSize:"13px"}},f.v?"🌱":f.p>20?"🐟":"🥚"," ",f.n),
      div({style:{display:"flex",alignItems:"center",gap:"10px"}},
        div({style:{textAlign:"right"}},
          div({style:{fontSize:"13px",fontWeight:"600",color:T.accent}},f.c+" cal"),
          div({style:{fontSize:"11px",color:T.good}},(f.p||0)+"g pro")
        ),
        btn({style:{background:"none",border:"none",color:T.muted,fontSize:"18px",padding:"0 4px",cursor:"pointer"},
          onClick:()=>updateDay(activeDate,d2=>{d2.foods.splice(i,1);})},"×")
      )
    )
  );

  const exerciseRows = day.exercises.map((ex,i) =>
    div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",
      borderBottom:i<day.exercises.length-1?`1px solid ${T.border}`:"none"}},
      span({style:{fontSize:"13px"}},ex.n),
      div({style:{display:"flex",alignItems:"center",gap:"10px"}},
        span({style:{fontSize:"13px",fontWeight:"600",color:T.good}},`−${ex.c} cal`),
        btn({style:{background:"none",border:"none",color:T.muted,fontSize:"18px",padding:"0 4px",cursor:"pointer"},
          onClick:()=>updateDay(activeDate,d2=>{d2.exercises.splice(i,1);})},"×")
      )
    )
  );

  const logCard = div({class:"card"},
    div({class:"card-title"},"Today's Log"),
    day.foods.length ? div({},...foodRows) : div({style:{fontSize:"13px",color:T.muted,padding:"8px 0"}},"No food logged yet — use the Log tab"),
    day.exercises.length ? div({style:{marginTop:"10px"}},
      div({style:{fontSize:"11px",fontWeight:"700",letterSpacing:"0.8px",textTransform:"uppercase",color:T.accent,marginBottom:"8px"}},"Exercise"),
      ...exerciseRows
    ) : null
  );

  // Mode selector
  const modeCard = div({class:"card"},
    div({class:"card-title"},"Mode"),
    div({style:{display:"flex",gap:"8px"}},
      ...["push","steady","hold"].map(m =>
        btn({
          style:{flex:"1",padding:"10px",borderRadius:"8px",border:`1px solid ${state.settings.mode===m?T.green:T.border}`,
            background:state.settings.mode===m?T.green+"18":T.card,
            color:state.settings.mode===m?T.green:T.textMid,
            fontWeight:state.settings.mode===m?"600":"400",
            fontSize:"13px"},
          onClick:()=>updateSettings(s2=>{s2.mode=m;})
        }, m==="push"?"🔥 Push":"steady"===m?"🌊 Steady":"🧳 Hold",
        div({style:{fontSize:"10px",color:state.settings.mode===m?T.green:T.muted,marginTop:"2px"}},
          m==="push"?`${calTarget(false)} cal`:m==="steady"?`${calTarget(false)} cal`:`${calTarget(false)} cal`)
      ))
    )
  );

  return div({}, dateStrip, fastEl||"", div({class:"card"},calBar), checkin, goalCard, logCard, modeCard);
}

// ── LOG VIEW ────────────────────────────────────────────────────────────────

let logSearch = "";
let logFilter = "all";

function renderLog() {
  const day = getDay(activeDate);

  // Date selector
  const dates = [];
  const d = new Date();
  for (let i=0;i<14;i++) { dates.push(d.toISOString().split("T")[0]); d.setDate(d.getDate()-1); }
  const dateStrip = div({class:"date-strip"}, ...dates.map(dt => {
    const isAct = dt === activeDate;
    const isTod = dt === TODAY();
    return btn({
      class:"date-btn"+(isAct?" active":"")+((!isAct&&isTod)?" today":""),
      onClick:()=>{ activeDate=dt; render(); }
    }, isTod?"Today":new Date(dt+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"}));
  }));

  // Food search
  const searchInput = inp({
    type:"text", value:logSearch, placeholder:"Search foods…",
    style:{width:"100%",padding:"9px 12px",border:`1px solid ${T.border}`,borderRadius:"8px",fontSize:"14px",background:T.card,color:T.text,outline:"none",marginBottom:"10px"},
    onInput: e => { logSearch = e.target.value; renderContent(); }
  });

  const filters = div({style:{display:"flex",gap:"6px",marginBottom:"10px",flexWrap:"wrap"}},
    ...["all","🌱 Vegan","🥩 Protein","🍺 Drinks"].map((f,i) => {
      const fid = ["all","vegan","protein","drink"][i];
      return btn({
        class:"chip"+(logFilter===fid?" active":""),
        onClick:()=>{ logFilter=fid; renderContent(); }
      },f);
    })
  );

  const filtered = FOODS.filter(f => {
    if (logSearch && !f.n.toLowerCase().includes(logSearch.toLowerCase())) return false;
    if (logFilter==="vegan") return f.v;
    if (logFilter==="protein") return !f.v && f.cat!=="drink" && f.cat!=="carb" && f.cat!=="fat";
    if (logFilter==="drink") return f.cat==="drink";
    return true;
  }).slice(0,40);

  const foodList = div({style:{maxHeight:"300px",overflowY:"auto",border:`1px solid ${T.border}`,borderRadius:"8px",background:T.card}},
    ...filtered.map((f,i) =>
      div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",
        borderBottom:i<filtered.length-1?`1px solid ${T.border}`:"none",cursor:"pointer"}},
        div({},
          div({style:{fontSize:"13px",fontWeight:"500"}},(f.v?"🌱":f.cat==="drink"?"🍺":f.p>20?"🐟":"🥚")+" "+f.n),
          div({style:{fontSize:"11px",color:T.muted}},f.c+" cal · "+f.p+"g protein")
        ),
        btn({
          style:{background:T.green,color:"#fff",border:"none",borderRadius:"6px",padding:"4px 10px",fontSize:"12px",fontWeight:"600",cursor:"pointer"},
          onClick:()=>updateDay(activeDate,d2=>{d2.foods.push({...f});})
        },"Add")
      )
    )
  );

  // Custom food entry
  let cf = {n:"",c:"",p:""};
  const cfName = inp({type:"text",placeholder:"Food name",
    style:{flex:"2",padding:"9px",border:`1px solid ${T.border}`,borderRadius:"8px",fontSize:"13px",background:T.card,color:T.text,outline:"none"},
    onInput:e=>cf.n=e.target.value});
  const cfCal = inp({type:"number",placeholder:"Cal",
    style:{flex:"1",padding:"9px",border:`1px solid ${T.border}`,borderRadius:"8px",fontSize:"13px",background:T.card,color:T.text,outline:"none"},
    onInput:e=>cf.c=e.target.value});
  const cfPro = inp({type:"number",placeholder:"Pro(g)",
    style:{flex:"1",padding:"9px",border:`1px solid ${T.border}`,borderRadius:"8px",fontSize:"13px",background:T.card,color:T.text,outline:"none"},
    onInput:e=>cf.p=e.target.value});
  const cfAdd = btn({
    style:{background:T.accent,color:"#fff",border:"none",borderRadius:"8px",padding:"9px 14px",fontSize:"13px",fontWeight:"600",cursor:"pointer"},
    onClick:()=>{
      if(!cf.n||!cf.c) return;
      updateDay(activeDate,d2=>{ d2.foods.push({n:cf.n,c:parseInt(cf.c)||0,p:parseInt(cf.p)||0,v:false,cat:"custom"}); });
    }
  },"Add");

  const customEntry = div({style:{display:"flex",gap:"6px",marginTop:"10px"}},cfName,cfCal,cfPro,cfAdd);

  // Exercise
  const exBtns = div({style:{display:"flex",flexWrap:"wrap",gap:"6px",marginTop:"8px"}},
    ...EXERCISES.map(ex =>
      btn({
        class:"chip",
        onClick:()=>updateDay(activeDate,d2=>{d2.exercises.push({...ex});})
      }, ex.n+" (−"+ex.c+")")
    )
  );

  return div({},
    dateStrip,
    div({class:"card"},
      div({class:"card-title"},"Add Food"),
      searchInput, filters, foodList, customEntry
    ),
    div({class:"card"},
      div({class:"card-title"},"Add Exercise"),
      exBtns
    )
  );
}

function renderSuggest() {

        style:{flex:"1",padding:"11px 4px",border:"none",
          background:suggestMode===m?T.green:"transparent",
          color:suggestMode===m?"#FEFCF7":T.textMid,
          fontWeight:suggestMode===m?"600":"400",fontSize:"13px"},
        onClick:()=>{ suggestMode=m; renderContent(); }
      }, ["🥗 Meals","🛒 Shopping","📚 Plan"][i])
    )
  );

  if (suggestMode === "meal") {
    const filtered = MEALS_MINI.filter(m => {
      if (mealType !== "any" && m.type !== mealType) return false;
      if (mealVibe === "vegan" && !m.vegan) return false;
      if (mealVibe === "fish" && m.tag !== "🐟") return false;
      if (mealVibe === "egg" && m.tag !== "🥚") return false;
      if (mealVibe === "meat" && m.tag !== "🥩") return false;

// ── PROGRESS VIEW ────────────────────────────────────────────────────────────

function renderProgress() {
  const entries = Object.entries(state.days)
    .filter(([,d]) => d.weight)
    .sort(([a],[b]) => a.localeCompare(b))
    .slice(-30);

  // Simple SVG chart
  let chartEl;
  if (entries.length < 2) {
    chartEl = div({class:"card"},
      div({class:"card-title"},"Weight Progress"),
      div({style:{textAlign:"center",color:T.muted,fontSize:"13px",padding:"20px 0"}},"Log weight for at least 2 days to see your chart.")
    );
  } else {
    const vals = entries.map(([,d]) => d.weight);
    const minW = Math.min(...vals) - 2;
    const maxW = Math.max(...vals) + 2;
    const W = 320, H = 140, pad = 10;
    const gw = s => state.settings.goalWeight;

    const pts = entries.map(([,d],i) => {
      const x = pad + (i / (entries.length-1)) * (W - pad*2);
      const y = H - pad - ((d.weight - minW) / (maxW - minW)) * (H - pad*2);
      return [x,y,d.weight];
    });

    const pathD = pts.map(([x,y],i) => (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1)).join(" ");
    const goalY = H - pad - ((gw() - minW) / (maxW - minW)) * (H - pad*2);

    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    svg.setAttribute("style","width:100%;height:auto");

    const addEl = (tag, attrs) => {
      const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
      svg.appendChild(e); return e;
    };
    addEl("line",{x1:pad,y1:goalY.toFixed(1),x2:W-pad,y2:goalY.toFixed(1),stroke:T.accent,strokeWidth:"1","stroke-dasharray":"4,4",opacity:"0.6"});
    addEl("path",{d:pathD,fill:"none",stroke:T.green,strokeWidth:"2.5","stroke-linecap":"round","stroke-linejoin":"round"});
    pts.forEach(([x,y,w]) => {
      const c = addEl("circle",{cx:x.toFixed(1),cy:y.toFixed(1),r:"4",fill:T.green,stroke:"#FEFCF7","stroke-width":"2"});
    });

    chartEl = div({class:"card"},
      div({class:"card-title"},"Weight Progress (30 days)"),
      div({style:{overflowX:"auto"}},svg),
      div({style:{fontSize:"11px",color:T.muted,textAlign:"right",marginTop:"4px"}},
        "Goal: "+state.settings.goalWeight+" lbs")
    );
  }

  // Recent log
  const recent = Object.entries(state.days)
    .sort(([a],[b]) => b.localeCompare(a))
    .slice(0,14);

  const logRows = recent.map(([date,d]) => {
    const cons = d.foods.reduce((s,f)=>s+f.c,0);
    const burn = d.exercises.reduce((s,e)=>s+e.c,0);
    const net = cons - burn;
    const tgt = calTarget(d.drankLastNight);
    return div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",
      padding:"8px 0",borderBottom:`1px solid ${T.border}`}},
      div({},
        div({style:{fontSize:"13px",fontWeight:"500"}},new Date(date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})),
        d.weight?div({style:{fontSize:"11px",color:T.muted}},d.weight+" lbs"):null
      ),
      div({style:{textAlign:"right"}},
        cons>0?div({style:{fontSize:"13px",fontWeight:"600",color:net>tgt?T.danger:T.good}},net+" net cal"):
          div({style:{fontSize:"12px",color:T.muted}},"—"),
        cons>0?div({style:{fontSize:"11px",color:T.muted}},cons+" eaten"):null
      )
    );
  });

  const histCard = div({class:"card"},
    div({class:"card-title"},"Recent History"),
    recent.length ? div({},...logRows) : div({style:{color:T.muted,fontSize:"13px",padding:"8px 0"}},"No data yet.")
  );

  return div({}, chartEl, histCard);
}

let planIdx = 0;
let planTouchStartX = null;

function renderPlan() {
  if (window._planIdx != null) { planIdx = window._planIdx; window._planIdx = null; }

  const card = PLAN_CARDS[planIdx];

  const indicator = div({style:{display:"flex",justifyContent:"center",gap:"6px",marginBottom:"14px"}},
    ...PLAN_CARDS.map((_,i) =>
      div({style:{width:i===planIdx?"20px":"8px",height:"8px",borderRadius:"4px",
        background:i===planIdx?T.green:T.border,transition:"all 0.2s",cursor:"pointer"},
        onClick:()=>{ planIdx=i; renderContent(); }
      })
    )
  );

  const cardEl = div({class:"card plan-card",
    style:{minHeight:"220px",userSelect:"none"},
    onTouchStart: e => { planTouchStartX = e.touches[0].clientX; },
    onTouchEnd: e => {
      if (planTouchStartX == null) return;
      const dx = e.changedTouches[0].clientX - planTouchStartX;
      planTouchStartX = null;
      if (dx < -40 && planIdx < PLAN_CARDS.length-1) { planIdx++; renderContent(); }
      else if (dx > 40 && planIdx > 0) { planIdx--; renderContent(); }
    }
  },
    div({style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}},
      div({style:{fontFamily:"'Playfair Display',serif",fontSize:"26px",fontWeight:"700",color:T.border,lineHeight:"1"}},card.num),
      div({style:{fontSize:"11px",fontWeight:"600",letterSpacing:"0.8px",textTransform:"uppercase",color:T.accent}},card.category)
    ),
    div({style:{fontFamily:"'Playfair Display',serif",fontSize:"19px",fontWeight:"700",marginBottom:"12px",lineHeight:"1.3"}},card.title),
    div({style:{fontSize:"14px",lineHeight:"1.7",color:T.textMid}},card.body)
  );

  const navBtns = div({style:{display:"flex",gap:"8px",marginBottom:"16px"}},
    btn({class:"btn btn-ghost",style:{flex:"1"},
      onClick:()=>{ if(planIdx>0){planIdx--;renderContent();} }
    },"← Prev"),
    btn({class:"btn",style:{flex:"1"},
      onClick:()=>{ if(planIdx<PLAN_CARDS.length-1){planIdx++;renderContent();} }
    },"Next →")
  );

  const allCards = div({class:"card"},
    div({class:"card-title"},"All Principles"),
    ...PLAN_CARDS.map((c,i) =>
      div({style:{display:"flex",alignItems:"center",gap:"12px",padding:"9px 0",
        borderBottom:i<PLAN_CARDS.length-1?`1px solid ${T.border}`:"none",cursor:"pointer"},
        onClick:()=>{ planIdx=i; renderContent(); }},
        div({style:{fontFamily:"'Playfair Display',serif",fontSize:"14px",fontWeight:"700",color:T.border,width:"28px",flexShrink:"0"}},c.num),
        div({style:{flex:"1"}},
          div({style:{fontSize:"13px",fontWeight:"600",color:i===planIdx?T.green:T.text}},c.title),
          div({style:{fontSize:"11px",color:T.muted}},c.category)
        ),
        i===planIdx?div({style:{fontSize:"11px",color:T.green,fontWeight:"600"}},"reading"):null
      )
    )
  );

  return div({}, indicator, cardEl, navBtns, allCards);
}

// ── SETTINGS (in today) ─────────────────────────────────────────────────────

function renderSettings() {
  const s = state.settings;
  const mkInp = (label, key, placeholder) => {
    const input = inp({type:"number",value:s[key]||"",placeholder,
      style:{width:"100%",padding:"9px 12px",border:`1px solid ${T.border}`,borderRadius:"8px",fontSize:"14px",background:T.card,color:T.text,outline:"none"},
      onInput: e => updateSettings(st => { st[key] = parseFloat(e.target.value)||null; })
    });
    return div({style:{marginBottom:"12px"}},el("label",{class:"label"},label),input);
  };
  return div({class:"card"},
    div({class:"card-title"},"Settings"),
    mkInp("Starting Weight (lbs)","startWeight","250"),
    mkInp("Goal Weight (lbs)","goalWeight","185"),
    mkInp("Month Goal (lbs)","monthGoalWeight","240")
  );
}

// ── RENDER ENGINE ───────────────────────────────────────────────────────────

function updateHeader() {
  const day = getDay(activeDate);
  const consumed = day.foods.reduce((s,f)=>s+f.c,0);
  const burned = day.exercises.reduce((s,e)=>s+e.c,0);
  const net = consumed - burned;
  const target = calTarget(day.drankLastNight);
  const netEl = document.getElementById("hdr-net");
  const tgtEl = document.getElementById("hdr-target");
  if (netEl) {
    netEl.textContent = net > 0 ? net : "—";
    netEl.style.color = net > target ? "#F5A87A" : net > 0 ? "#A8DDB5" : "rgba(254,252,247,0.4)";
  }
  if (tgtEl) tgtEl.textContent = "NET CAL / " + target;
}

function renderContent() {
  const content = document.getElementById("content");
  content.innerHTML = "";

  let view;
  if (activeTab === "today") view = div({},renderToday(), renderSettings());
  else if (activeTab === "log") view = renderLog();
  else if (activeTab === "suggest") view = renderSuggest();
  else if (activeTab === "progress") view = renderProgress();
  else if (activeTab === "plan") view = renderPlan();

  if (view) content.appendChild(view);
  updateHeader();
}

function render() {
  // Nav
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  TABS.forEach(t => {
    const b = document.createElement("button");
    b.className = "nav-btn" + (activeTab === t.id ? " active" : "");
    b.textContent = t.label;
    b.addEventListener("click", () => { activeTab = t.id; render(); });
    nav.appendChild(b);
  });

  renderContent();
}

// Boot
render();
</script>
