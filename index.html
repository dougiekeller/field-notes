<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a18">
<title>Field Notes</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#1a1a18;--card:#242420;--border:#333330;--text:#e8dfd1;--muted:#a89a86;--gold:#c8b590;--green:#6b8f5e;--blue:#5a8ab5;--amber:#d4a05a;--red:#c46b6b;--plum:#b07090;--serif:'Source Serif 4',Georgia,serif;--sans:'DM Sans',Helvetica,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
input{font-family:var(--sans)}
.app{max-width:500px;margin:0 auto;padding:20px 16px 100px}
.header h1{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--text)}
.header p{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:6px;margin:16px 0 20px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all .2s}
.tab.active{background:var(--gold);color:var(--bg);font-weight:700}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}
.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:8px}
.section-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin:20px 0 10px}
.check-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--border);transition:all .2s}
.check-btn.done{border-color:var(--green)}
.check-box{width:28px;height:28px;border-radius:8px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;transition:all .2s}
.check-btn.done .check-box{background:var(--green)}
.check-label{color:var(--muted);font-size:15px}
.check-btn.done .check-label{color:var(--gold)}
.stat-row{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border-radius:12px;padding:12px 8px;text-align:center}
.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.stat-val{font-family:var(--serif);font-size:28px;font-weight:700;margin:4px 0 2px}
.stat-unit{color:var(--muted);font-size:11px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;background:var(--bg);border:1px solid #444440;border-radius:8px;padding:10px 12px;color:var(--text);font-size:16px;outline:none}
.input-row input:focus{border-color:var(--green)}
.btn{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:700}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:rgba(90,138,181,.13);color:var(--blue);border:1px solid rgba(90,138,181,.27)}
.exercise-btn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:16px;background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--border)}
.exercise-btn .icon{font-size:28px;margin-right:12px}
.exercise-btn .info h3{color:var(--text);font-size:15px;font-weight:600}
.exercise-btn .info p{color:var(--muted);font-size:12px;margin-top:2px}
.exercise-btn .info .weight-tag{color:var(--green);font-size:11px;margin-top:2px}
.arrow{color:var(--muted);font-size:18px;flex-shrink:0}
.back-btn{color:var(--muted);font-size:15px;padding:8px 0;margin-bottom:8px}
.detail-h1{font-family:var(--serif);font-size:26px;font-weight:700}
.step{display:flex;gap:10px;margin-bottom:10px}
.step-num{width:24px;height:24px;border-radius:12px;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step p,.cue p,.mistake p{color:#d4cbbf;font-size:14px;line-height:1.6}
.cue{display:flex;gap:8px;margin-bottom:8px}
.mistake{display:flex;gap:8px;margin-bottom:6px}
.shuffler-card{background:var(--bg);border-radius:10px;padding:12px;border:1px solid var(--border);margin-bottom:10px;width:100%;text-align:left}
.shuffler-card:last-child{margin-bottom:0}
.meal-cat{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.meal-name{color:var(--text);font-size:15px;font-weight:600;margin:3px 0 4px}
.meal-desc{color:var(--muted);font-size:13px;line-height:1.4;margin-bottom:6px}
.meal-meta{display:flex;gap:8px;flex-wrap:wrap}
.meal-protein{color:var(--green);font-size:12px;font-weight:600}
.meal-prep{color:var(--muted);font-size:12px}
.guideline{padding:16px;background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--border)}
.guideline.highlight{background:#2a2520;border-color:#4a3a2a}
.guideline h3{font-size:14px;font-weight:700;margin-bottom:4px}
.guideline p{color:var(--muted);font-size:13px;line-height:1.55}
.ref-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid}
.ref-row:last-child{border-bottom:none}
.ref-food{color:var(--muted);font-size:13px}
.ref-val{font-size:13px;font-weight:600}
.water-bar{display:flex;gap:3px}
.water-seg{flex:1;height:6px;border-radius:3px;background:var(--border);transition:background .2s}
.water-seg.filled{background:var(--blue)}
.window-btn{padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card)}
.window-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.week-row{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid transparent}
.week-row.today-row{border-color:var(--green)}
.week-day{width:40px;height:40px;border-radius:10px;background:var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700;flex-shrink:0;margin-right:12px}
.week-row.today-row .week-day{background:rgba(107,143,94,.13);color:var(--green)}
.chart-svg{width:100%;overflow:visible}
.page{display:none}.page.active{display:block}
.hard-day{padding:14px;border-radius:10px;background:linear-gradient(135deg,#2a2520,#242420);border:1px solid #3a352a;margin-top:16px}
.drink-header{color:var(--plum);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;opacity:.8}
.drink-header:first-child{margin-top:0}
</style>
</head>

<div class="app" id="app"></div>
<script>
const EXERCISES={halo:{name:"Kettlebell Halo",target:"Shoulders, core, mobility",weight:"Light (12-16 lb)",icon:"🔄",why:"Warms up your shoulders and thoracic spine. Builds the mobility that prevents the shoulder injuries you've dealt with before.",setup:"Stand with feet hip-width apart. Hold the kettlebell by the horns (the sides of the handle) upside down, with the bell pointing up, at chest height. Brace your core like someone's about to poke you in the stomach.",movement:["Slowly circle the kettlebell around your head, keeping it close to your skull.","As it passes behind your head, your elbows will point forward. Keep them tight, don't let them flare wide.","Complete the circle back to chest height. That's one rep.","Alternate directions each rep, or do a set in each direction."],cues:["The bell moves, your head stays still. Don't duck or weave.","Keep your ribs down. If your back arches, the weight is too heavy.","Go slow. This is mobility work, not a race.","Grip the horns firmly. The bell should stay inverted (pointing up) the whole time."],mistakes:["Moving too fast and losing control of the path","Letting the elbows flare wide behind the head","Arching the lower back as the bell passes behind"],sets:"2 sets of 8 each direction",rest:"30 seconds between sets"},gobletSquat:{name:"Goblet Squat",target:"Quads, glutes, core, hip mobility",weight:"Moderate (25-35 lb)",icon:"🏋️",why:"The single best lower body exercise for someone coming back. The front-loaded weight actually helps your posture and keeps your back safe. It also opens up your hips, which is critical for preventing the back issues you've had.",setup:"Hold the kettlebell by the horns at chest height, close to your body. The bell hangs below your hands. Feet shoulder-width apart or slightly wider, toes turned out 15-30 degrees.",movement:["Take a breath in and brace your core.","Push your hips back and down like you're sitting into a low chair.","Drive your knees out over your toes (they should track in the same direction your toes point).","Go as deep as you comfortably can. Ideally your hip crease drops below your knee.","At the bottom, your elbows should be inside your knees. Use them to gently push your knees out if needed.","Drive through your whole foot to stand back up. Squeeze your glutes at the top."],cues:["Chest up the whole time. If you start folding forward, lighten the weight.","Weight balanced across your whole foot, not just your toes.","Your knees should push OUT, not cave in.","Keep the bell tight to your chest. If it drifts forward, it pulls your back with it.","Breathe in at the top, hold through the squat, exhale as you stand."],mistakes:["Letting knees cave inward (think about spreading the floor with your feet)","Rising onto toes at the bottom","Rounding the upper back and letting the bell drift away from your chest","Cutting depth short because of tight hips (it's fine to start shallow and go deeper over weeks)"],sets:"3 sets of 8-10",rest:"60-90 seconds between sets"},deadlift:{name:"Kettlebell Deadlift",target:"Hamstrings, glutes, lower back, grip",weight:"Moderate to heavy (35-50 lb)",icon:"💪",why:"Teaches the hip hinge, which is the foundation of the swing and protects your back in everyday life. This is the pattern that keeps your spine safe when you pick up your kids or groceries.",setup:"Place the kettlebell on the floor between your feet. Feet hip-width apart. Stand close enough that when you look down, the handle is roughly in line with your ankles.",movement:["Push your hips BACK (not down) and reach for the handle. Your shins should stay nearly vertical.","Grab the handle with both hands. Shoulders should be slightly in front of the bell.","Pull your shoulders down and back (think: put your shoulder blades in your back pockets). You should feel tension in your hamstrings.","Drive through your feet and push your hips forward to stand up. The bell leaves the ground because your hips moved, not because your arms pulled.","Stand tall at the top. Squeeze glutes. Shoulders back.","Reverse the movement: hips back first, then bend knees once the bell passes them. Set it down with control."],cues:["This is a HIP movement. Your arms are just hooks holding the weight.","Your back stays flat the entire time. If it rounds, the weight is too heavy or you're not hinging enough.","Think about pushing the floor away with your feet rather than pulling the bell up.","The bell should travel in a straight vertical line, close to your body.","Breathe in at the top, brace, hinge down, exhale as you stand."],mistakes:["Squatting the weight up instead of hinging (knees bending too much, shins tilting forward)","Rounding the lower back (the #1 thing to avoid with your history)","Pulling with the arms instead of driving with the hips","Looking up at the ceiling (keep your neck neutral, eyes a few feet in front of you)"],sets:"3 sets of 8",rest:"60-90 seconds between sets"},swing:{name:"Two-Hand Kettlebell Swing",target:"Full posterior chain, cardio conditioning",weight:"Moderate (25-40 lb to start)",icon:"🔥",why:"The king of kettlebell exercises. Burns a ton of calories, builds explosive hip power (hello basketball), and conditions your cardiovascular system in very little time. This is the exercise that will move the needle most on both fitness and weight loss.",setup:"Place the bell about a foot in front of you. Feet slightly wider than hip-width. Hinge at the hips (like the deadlift) and grab the handle with both hands.",movement:["Hike the bell back between your legs like a football snap. Your forearms should touch your inner thighs.","Explosively drive your hips forward and squeeze your glutes HARD. This hip snap is what propels the bell.","Let the bell float up to about chest height. Your arms stay straight but relaxed. They don't lift the bell.","As the bell starts to fall, guide it back between your legs by hinging your hips. Wait until your forearms reconnect with your inner thighs before hinging.","Immediately snap your hips again for the next rep. It's a continuous rhythm.","To stop: after a swing, let the bell come back through your legs and set it down in front of you."],cues:["This is NOT a squat-and-front-raise. Your arms don't lift the bell. Your hips throw it.","At the top of each swing, you should be standing in a tall plank: glutes squeezed, core tight, shoulders packed down.","The bell should feel weightless for a moment at the top. If your shoulders are burning, you're using your arms too much.","Think about jumping without leaving the ground. Same hip explosion.","Breathe out sharply (like a \"hah!\") at the top of each swing. Breathe in on the way down.","Your knees bend slightly but this is a HINGE, not a squat. Shins stay mostly vertical."],mistakes:["Squatting instead of hinging (most common mistake by far)","Using the arms to lift the bell instead of the hip snap","Letting the bell pull you forward onto your toes","Hinging too early on the downswing (wait for the forearms to touch your thighs)","Hyperextending the back at the top instead of squeezing glutes"],sets:"5 sets of 10-15 (week 1-2), build to 5x20",rest:"45-60 seconds between sets"},turkishGetUp:{name:"Turkish Get-Up",target:"Full body stability, shoulders, core, hips",weight:"Light to start (12-20 lb)",icon:"🧘",why:"The ultimate injury-prevention exercise. It strengthens your shoulders through a full range of motion, builds rotational core stability, and exposes weaknesses you didn't know you had. Start light. Seriously. Doing these well at a low weight is more valuable than struggling with a heavy one.",setup:"Lie on your back. The kettlebell is on the floor next to your right shoulder. Roll toward it and grip the handle with your right hand, then roll back. Press it straight up toward the ceiling. Bend your right knee so your right foot is flat on the floor. Left arm is out at 45 degrees, left leg straight on the floor.",movement:["STEP 1 - Roll to elbow: Drive through your right foot and left elbow to rise up onto your left forearm. The bell stays punched toward the ceiling. Eyes on the bell.","STEP 2 - Rise to hand: Press up from your left forearm to your left hand. You're now in a tall seated position, one arm overhead.","STEP 3 - High bridge: Push your hips up toward the ceiling, making a bridge. Your weight is on your left hand and right foot.","STEP 4 - Sweep the leg: Sweep your left leg back and place your left knee on the ground roughly where your left hand is. You're now in a kneeling position.","STEP 5 - Upright torso: Lift your left hand off the ground and bring your torso upright. You're in a lunge position with the bell overhead.","STEP 6 - Stand: Drive up from the lunge to standing. Both feet together, bell overhead.","STEP 7 - Reverse it: Step back into a lunge with the left leg, bring left hand to ground, sweep left leg forward, sit down to hand, lower to elbow, lower to lying. That's ONE rep."],cues:["EYES ON THE BELL at all times until you're standing. This keeps your shoulder packed and stable.","The arm holding the bell stays vertical the entire time. Imagine balancing a glass of water on your fist.","Go painfully slow. Each step is its own moment. Pause between them.","Keep your wrist straight and stacked under the bell. Don't let it bend backward.","If anything feels unstable, stop, go back a step, and try again. It's okay to practice without weight first."],mistakes:["Rushing through the steps (slow is the point)","Losing eye contact with the bell (shoulder injury risk)","Bending the wrist back under load","Skipping the high bridge step (it's awkward but essential)","Going too heavy too soon (ego is the enemy here)"],sets:"2 sets of 2-3 per side (week 1-2), build to 3x3",rest:"Rest as needed between reps. This is a skill exercise."},farmerCarry:{name:"Farmer's Carry",target:"Grip, core, posture, mental toughness",weight:"Heavy as you can manage (one or two bells)",icon:"🚶",why:"Deceptively simple, outrageously effective. Builds the core stability and grip strength that protects your back and shoulders. Also trains the upright posture that desk work destroys. You'll feel this the next day in places you didn't expect.",setup:"Place one or two kettlebells on the floor next to you. Deadlift them up (flat back, hip hinge). Stand tall with the weight at your sides.",movement:["Walk in a straight line with controlled, even steps.","Focus on standing as TALL as possible. Think about someone pulling a string from the top of your head.","If using one bell (suitcase carry), resist the urge to lean toward the weighted side. Stay perfectly upright.","Walk for distance (start with 40-50 yards) or time (30-45 seconds).","Set the weight down with a proper deadlift (hip hinge, flat back). Don't just drop it."],cues:["Shoulders down and back. Don't let them creep up toward your ears.","Squeeze the handle like you're trying to crush it. Active grip improves everything.","Core braced the entire walk. Breathe normally but keep tension.","Short, controlled steps. This isn't a race.","If using one bell, alternate sides each set. The anti-rotation component is gold for your core."],mistakes:["Leaning to one side (especially with single-bell carries)","Shoulders hiking up toward the ears","Shuffling or taking uneven steps","Looking down (keep eyes forward, chest up)"],sets:"3-4 walks of 40-50 yards (or 30-45 seconds)",rest:"60 seconds between walks"}};

const WORKOUTS={A:{name:"Workout A",subtitle:"Foundation + Power",duration:"20-25 min",exercises:[{id:"halo",sets:"2x8 each direction"},{id:"gobletSquat",sets:"3x8-10"},{id:"swing",sets:"5x10-15"},{id:"farmerCarry",sets:"3 walks"}]},B:{name:"Workout B",subtitle:"Stability + Strength",duration:"20-25 min",exercises:[{id:"halo",sets:"2x8 each direction"},{id:"deadlift",sets:"3x8"},{id:"turkishGetUp",sets:"2x2-3 per side"},{id:"swing",sets:"4x12-15"}]}};

const WEEK_PLAN=[{day:"Mon",type:"kettlebell",workout:"A",label:"Kettlebell A"},{day:"Tue",type:"walk",label:"Walk 20-30 min"},{day:"Wed",type:"kettlebell",workout:"B",label:"Kettlebell B"},{day:"Thu",type:"walk",label:"Walk 20-30 min"},{day:"Fri",type:"kettlebell",workout:"A",label:"Kettlebell A"},{day:"Sat",type:"bonus",label:"Basketball / Swim"},{day:"Sun",type:"rest",label:"Rest or light walk"}];

const MEALS={breakfast:[{name:"Oatmeal Bowl",desc:"Steel-cut or rolled oats with banana, walnuts, flax seed, drizzle of maple syrup. Add a scoop of peanut butter for extra protein.",protein:"~14g",prep:"10 min"},{name:"Veggie Scramble",desc:"Two or three eggs scrambled with whatever CSA veg you have: peppers, onions, greens, tomatoes. Toast on the side.",protein:"~20g",prep:"10 min"},{name:"Smoothie",desc:"Frozen banana, handful of spinach, peanut butter, plant milk, scoop of protein powder or hemp seeds. Blend and go.",protein:"~22g",prep:"5 min"},{name:"Avocado Toast + Egg",desc:"Sourdough toast, smashed avocado, fried or poached egg, everything bagel seasoning, chili flakes.",protein:"~14g",prep:"8 min"},{name:"Overnight Oats",desc:"Oats, chia seeds, plant milk, mixed the night before. Top with berries and nuts in the morning. Zero morning effort.",protein:"~12g",prep:"5 min (night before)"},{name:"Greek Yogurt + Granola",desc:"Big bowl of Greek yogurt (or coconut yogurt) with granola, berries, honey, hemp seeds.",protein:"~18g",prep:"3 min"},{name:"Breakfast Burrito",desc:"Scrambled eggs, black beans, salsa, avocado in a whole wheat tortilla. Can batch-make and freeze these.",protein:"~24g",prep:"12 min"},{name:"Tofu Scramble",desc:"Crumbled firm tofu with turmeric, nutritional yeast, peppers, onions. Tastes better than it sounds.",protein:"~22g",prep:"15 min"},{name:"Banana Peanut Butter Toast",desc:"Whole grain toast, thick layer of peanut butter, sliced banana, sprinkle of cinnamon. Simple and filling.",protein:"~12g",prep:"3 min"},{name:"Chia Pudding",desc:"Chia seeds soaked in coconut milk overnight, topped with mango or berries, shredded coconut, nuts.",protein:"~10g",prep:"5 min (night before)"}],lunch:[{name:"Ahi Tuna Rice Bowl",desc:"Seared ahi over rice with avocado, cucumber, edamame, soy-ginger dressing",protein:"~35g",prep:"15 min"},{name:"Big Grain Bowl",desc:"Quinoa or farro + roasted CSA vegetables + chickpeas + tahini or green goddess dressing",protein:"~22g",prep:"20 min (or use leftover grains)"},{name:"Lentil Soup + Bread",desc:"Red or green lentil soup with cumin and lemon, thick slice of sourdough, big side salad",protein:"~25g",prep:"30 min (or batch cook Sunday)"},{name:"Salmon Salad Plate",desc:"Baked or pan-seared salmon over mixed greens, roasted sweet potato, seeds, lemon vinaigrette",protein:"~38g",prep:"20 min"},{name:"Black Bean Tacos",desc:"Seasoned black beans, avocado, pickled onion, cabbage slaw, corn tortillas",protein:"~20g",prep:"15 min"},{name:"Mediterranean Plate",desc:"Hummus, falafel (frozen is fine), cucumber, tomato, olives, whole wheat pita",protein:"~18g",prep:"10 min"},{name:"Tofu Stir-Fry",desc:"Crispy tofu with whatever CSA veg you have, garlic-ginger sauce, brown rice",protein:"~28g",prep:"20 min"},{name:"Sardines on Toast",desc:"Good sardines on sourdough with arugula, lemon, capers, quick pickled shallot",protein:"~30g",prep:"10 min"},{name:"White Bean + Kale Soup",desc:"Cannellini beans, lacinato kale, garlic, parmesan rind (optional), crusty bread",protein:"~22g",prep:"25 min"},{name:"Veggie Burrito Bowl",desc:"Rice, black beans, roasted peppers and onions, salsa, guacamole, lime",protein:"~20g",prep:"15 min"}],dinner:[{name:"Sheet Pan Salmon + Veg",desc:"Salmon filets with whatever seasonal veg is in the CSA box, one pan, minimal cleanup",protein:"~35g",prep:"25 min"},{name:"Pasta with White Beans + Greens",desc:"Orecchiette or penne with cannellini beans, garlic, CSA greens, chili flakes, parm",protein:"~22g",prep:"20 min"},{name:"Fish Tacos",desc:"Quick-seared white fish, cabbage slaw, chipotle crema, corn tortillas. Kids love these.",protein:"~28g",prep:"20 min"},{name:"Coconut Chickpea Curry",desc:"Chickpeas in coconut milk with tomatoes, spinach, warm spices, over rice",protein:"~18g",prep:"25 min"},{name:"Veggie Fried Rice",desc:"Day-old rice with edamame, scrambled egg, whatever veg, soy sauce. Perfect for using up CSA odds and ends.",protein:"~20g",prep:"15 min"},{name:"Loaded Sweet Potatoes",desc:"Baked sweet potatoes with black beans, salsa, avocado, cilantro. Kids get theirs with butter and cheese.",protein:"~18g",prep:"45 min (mostly hands-off)"},{name:"Minestrone",desc:"Big pot of seasonal vegetables, beans, small pasta, tomato broth. Batch cook and eat for days.",protein:"~16g",prep:"35 min"},{name:"Pesto Pasta + Broccoli",desc:"Pasta with pesto (store-bought is fine), roasted broccoli, white beans, lemon zest",protein:"~20g",prep:"20 min"},{name:"Bean and Cheese Quesadillas",desc:"Black bean quesadillas with a massive side salad for you. Kids won't complain about this one.",protein:"~22g",prep:"15 min"},{name:"Homemade Pizza Night",desc:"Store-bought dough, good sauce, load yours with vegetables. Fun family activity, Friday night staple.",protein:"~18g",prep:"30 min"}],postWorkout:[{name:"Greek Yogurt + Banana + Walnuts",desc:"Protein, carbs, and fat in one bowl. Ready in 30 seconds. This is your go-to if you only remember one option.",protein:"~18g",prep:"1 min"},{name:"Two Eggs on Toast",desc:"Scrambled or fried on whole grain toast. Simple, filling, and you're back at your desk in 10 minutes.",protein:"~18g",prep:"5 min"},{name:"PB Banana Toast",desc:"Thick peanut butter on toast with sliced banana. Hits the sweet craving without going off the rails.",protein:"~12g",prep:"3 min"},{name:"Protein Smoothie",desc:"Frozen banana, plant milk, scoop of protein powder or hemp seeds, tablespoon of peanut butter. Blend and drink while working.",protein:"~22g",prep:"3 min"},{name:"Hummus Pita Plate",desc:"Whole wheat pita, big scoop of hummus, cucumber, tomato. Substantial enough to bridge to dinner.",protein:"~12g",prep:"3 min"},{name:"Cottage Cheese + Fruit",desc:"High protein, low effort. Add berries or peach slices and a drizzle of honey.",protein:"~20g",prep:"1 min"},{name:"Edamame + Rice Cake",desc:"Microwaved edamame with sea salt plus a rice cake with almond butter. Weirdly satisfying combo.",protein:"~14g",prep:"3 min"},{name:"Black Bean Quesadilla (half)",desc:"One tortilla, black beans, a little cheese, folded and pan-cooked. Cut in half, save the other half for later if you want.",protein:"~15g",prep:"5 min"}],snack:[{name:"Apple + Almond Butter",desc:"A classic. The fat and protein from the nut butter keeps you full.",protein:"~7g"},{name:"Hummus + Raw Veg",desc:"Carrots, cucumber, peppers from the CSA box. Generous hummus.",protein:"~8g"},{name:"Trail Mix (small handful)",desc:"Almonds, walnuts, dried fruit, dark chocolate chips. Measure it out, don't eat from the bag.",protein:"~6g"},{name:"Edamame with Sea Salt",desc:"Frozen, microwaved 3 min. Surprisingly satisfying.",protein:"~12g"},{name:"Banana + Peanut Butter",desc:"Quick energy before a workout or between meals.",protein:"~8g"},{name:"Roasted Chickpeas",desc:"Toss canned chickpeas with olive oil and spices, roast at 400 for 25 min. Batch-friendly.",protein:"~10g"}]};

// State
let state={tab:'today',weights:JSON.parse(localStorage.getItem('fn-weights')||'[]'),dailyChecks:JSON.parse(localStorage.getItem('fn-daily-checks')||'{}'),workoutLog:JSON.parse(localStorage.getItem('fn-workout-log')||'{}'),eatingWindow:JSON.parse(localStorage.getItem('fn-eating-window')||'{"open":11,"close":19}'),waterCount:JSON.parse(localStorage.getItem('fn-water-count')||'{}'),shuffled:{breakfast:null,lunch:null,postWorkout:null,dinner:null,snack:null},detailExercise:null,detailWorkout:null,editingWindow:false};

function save(key,val){localStorage.setItem(key,JSON.stringify(val))}
function today(){return new Date().toISOString().split('T')[0]}
function todayDow(){return["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()]}
function fmtHour(h){if(h===0||h===24)return"12am";if(h===12)return"12pm";return h>12?`${h-12}pm`:`${h}am`}
function windowLabel(){return`${fmtHour(state.eatingWindow.open)}-${fmtHour(state.eatingWindow.close)}`}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function getStreak(){let s=0;const d=new Date();for(let i=0;i<90;i++){const ds=d.toISOString().split('T')[0];const c=state.dailyChecks[ds];if(c&&(c.weighed||c.window||c.moved))s++;else if(i>0)break;d.setDate(d.getDate()-1)}return s}
function getWeekCompletions(){const d=new Date();const s=new Date(d);s.setDate(d.getDate()-d.getDay());let c=0;for(let i=0;i<7;i++){const ds=new Date(s.getTime()+i*864e5).toISOString().split('T')[0];if(state.workoutLog[ds])c++}return c}

function shuffleMeal(cat){const meals=MEALS[cat];const cur=state.shuffled[cat];let next;do{next=meals[Math.floor(Math.random()*meals.length)]}while(meals.length>1&&cur&&next.name===cur.name);state.shuffled[cat]=next;render()}
function shuffleAll(){['breakfast','lunch','postWorkout','dinner','snack'].forEach(shuffleMeal)}

function addWater(n){const d=today();state.waterCount[d]=Math.max(0,(state.waterCount[d]||0)+n);save('fn-water-count',state.waterCount);render()}
function setWindow(key,val){state.eatingWindow[key]=val;save('fn-eating-window',state.eatingWindow);render()}

function makeChart(weights){
  if(weights.length<2)return'';
  const data=weights.slice(-30);
  const vals=data.map(d=>d.weight);
  const mn=Math.min(...vals)-3,mx=Math.max(...vals)+3;
  const w=460,h=180,pl=45,pr=10,pt=10,pb=25;
  const cw=w-pl-pr,ch=h-pt-pb;
  const pts=data.map((d,i)=>{const x=pl+(i/(data.length-1))*cw;const y=pt+ch-(d.weight-mn)/(mx-mn)*ch;return{x,y,d}});
  const goalY=pt+ch-(195-mn)/(mx-mn)*ch;
  const ticks=5;
  let svg=`<svg viewBox="0 0 ${w} ${h}" class="chart-svg">`;
  svg+=`<line x1="${pl}" y1="${goalY}" x2="${w-pr}" y2="${goalY}" stroke="var(--green)" stroke-dasharray="4 4" opacity=".6"/>`;
  svg+=`<text x="${w-pr}" y="${goalY-4}" fill="var(--green)" font-size="10" text-anchor="end">Goal: 195</text>`;
  for(let i=0;i<ticks;i++){const v=mn+(mx-mn)*(i/(ticks-1));const y=pt+ch-ch*(i/(ticks-1));svg+=`<text x="${pl-6}" y="${y+4}" fill="var(--muted)" font-size="10" text-anchor="end">${Math.round(v)}</text>`}
  for(let i=0;i<data.length;i+=Math.max(1,Math.floor(data.length/6))){svg+=`<text x="${pts[i].x}" y="${h-2}" fill="var(--muted)" font-size="9" text-anchor="middle">${data[i].date.slice(5)}</text>`}
  let path='M'+pts.map(p=>`${p.x},${p.y}`).join(' L');
  svg+=`<path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2"/>`;
  pts.forEach(p=>{svg+=`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--gold)"/>`});
  svg+=`</svg>`;return svg;
}

  [['breakfast','🍳','Breakfast'],['lunch','🍱','Lunch'],['postWorkout','💪','Post-Workout'],['dinner','🍽️','Dinner (5:30)'],['snack','🥜','Snack']].forEach(([cat,icon,label])=>{

  GUIDELINES.forEach(g=>{html+=`<div class="guideline ${g.highlight?'highlight':''}"><h3 style="color:${g.highlight?'var(--amber)':'var(--gold)'}">${esc(g.title)}</h3><p>${esc(g.text)}</p></div>`});
  // Window settings
  html+=`<div class="card" style="background:#1a2020;border:1px solid #2a3a3a"><div style="display:flex;justify-content:space-between;align-items:center;${state.editingWindow?'margin-bottom:12px':''}"><div><p style="color:var(--blue);font-size:13px;font-weight:700">Eating Window</p><p style="font-size:17px;font-weight:600;margin-top:2px">${wl} <span style="color:var(--muted);font-size:13px;font-weight:400">(${ew.close-ew.open}hr eat / ${24-(ew.close-ew.open)}hr fast)</span></p></div><button class="btn-blue" style="padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600" onclick="state.editingWindow=!state.editingWindow;render()">${state.editingWindow?'Done':'Adjust'}</button></div>`;
  if(state.editingWindow){
    html+=`<div><label style="color:var(--muted);font-size:12px;display:block;margin-bottom:6px">First meal</label><div style="display:flex;gap:6px;flex-wrap:wrap">${[6,7,8,9,10,11,12,13].map(h=>`<button class="window-btn ${ew.open===h?'active':''}" onclick="setWindow('open',${h})">${fmtHour(h)}</button>`).join('')}</div></div>`;
    html+=`<div style="margin-top:10px"><label style="color:var(--muted);font-size:12px;display:block;margin-bottom:6px">Last meal by</label><div style="display:flex;gap:6px;flex-wrap:wrap">${[17,18,19,20,21].map(h=>`<button class="window-btn ${ew.close===h?'active':''}" onclick="setWindow('close',${h})">${fmtHour(h)}</button>`).join('')}</div></div>`;
  }
  html+=`</div>`;
  // Protein
  html+=`<div class="card" style="background:#202a20;border:1px solid #2a3a2a"><p style="color:var(--green);font-size:13px;font-weight:700;margin-bottom:8px">Protein Cheat Sheet</p>${PROTEINS.map(([f,g],i)=>`<div class="ref-row" style="border-color:#2a3a2a"><span class="ref-food">${f}</span><span class="ref-val" style="color:var(--green)">${g}</span></div>`).join('')}</div>`;
  // Drinks
  html+=`<div class="card" style="background:#2a2025;border:1px solid #3a2a35"><p style="color:var(--plum);font-size:13px;font-weight:700;margin-bottom:4px">Drink Cheat Sheet</p><p style="color:var(--muted);font-size:12px;margin-bottom:10px">One for pleasure, then switch lighter.</p>${DRINKS.map(d=>d.h?`<p class="drink-header">${d.h}</p>`:`<div class="ref-row" style="border-color:#2a2025"><span class="ref-food" style="flex:1">${d.d}</span><span class="ref-val" style="color:#d4cbbf;margin-left:8px;white-space:nowrap">${d.dot} ${d.c}</span></div>`).join('')}</div>`;
  html+=`</div>`;

  // PROGRAM
  html+=`<div class="page ${state.tab==='program'?'active':''}">`;
  html+=`<div class="card" style="background:linear-gradient(135deg,#2a2a25,#242420);border:1px solid #3a3a35"><p style="color:var(--gold);font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:6px">Phase 1: Foundation</p><p style="color:var(--muted);font-size:13px;line-height:1.5">Weeks 1-4. Build the base. Intensity should feel almost too easy at first. That's on purpose. You're building patterns and resilience so you don't get hurt and lose momentum again.</p></div>`;
  html+=`<p class="section-label">Weekly Schedule</p>`;
  const typeColors={kettlebell:'var(--green)',walk:'var(--blue)',bonus:'var(--gold)',rest:'#666'};
  WEEK_PLAN.forEach(p=>{const isToday=p.day===dow;html+=`<div class="week-row ${isToday?'today-row':''}" ${p.workout?`onclick="state.detailWorkout='${p.workout}';render()" style="cursor:pointer"`:''} ><div style="display:flex;align-items:center"><div class="week-day">${p.day}</div><div><p style="font-size:14px;font-weight:600">${esc(p.label)}</p><p style="color:${typeColors[p.type]};font-size:12px;margin-top:2px">${p.type==='kettlebell'?'Lunch break':p.type==='walk'?'Midday or evening':p.type==='bonus'?'Weekend fun':'Recovery'}</p></div></div>${p.workout?'<span class="arrow">→</span>':''}</div>`});
  html+=`<p class="section-label">Workouts</p>`;
  Object.entries(WORKOUTS).forEach(([key,wo])=>{html+=`<button class="exercise-btn" onclick="state.detailWorkout='${key}';render()"><div><p style="font-size:16px;font-weight:700">${esc(wo.name)}</p><p style="color:var(--muted);font-size:13px;margin-top:2px">${esc(wo.subtitle)} / ~${esc(wo.duration)}</p><p style="color:var(--green);font-size:12px;margin-top:4px">${wo.exercises.map(e=>EXERCISES[e.id].name).join(' → ')}</p></div><span class="arrow">→</span></button>`});
  html+=`<div class="card" style="background:#2a2520;border:1px solid #3a352a"><p style="color:var(--amber);font-size:13px;font-weight:700;margin-bottom:6px">Equipment Needed</p><p style="color:var(--muted);font-size:13px;line-height:1.5">One moderate kettlebell (25-35 lb) for most exercises, one lighter one (12-20 lb) for halos and Turkish get-ups. If you only have one, go moderate and keep get-ups and halos lighter in reps.</p></div>`;
  html+=`</div>`;

  // EXERCISES
  html+=`<div class="page ${state.tab==='exercises'?'active':''}">`;
  html+=`<p style="color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:16px">Tap any exercise for detailed form instructions, cues, and common mistakes. Read each one before your first workout.</p>`;
  Object.entries(EXERCISES).forEach(([key,ex])=>{html+=`<button class="exercise-btn" onclick="state.detailExercise='${key}';render()"><div style="display:flex;align-items:center"><span class="icon">${ex.icon}</span><div class="info"><h3>${esc(ex.name)}</h3><p>${esc(ex.target)}</p><p class="weight-tag">${esc(ex.weight)}</p></div></div><span class="arrow">→</span></button>`});
  html+=`<div class="card" style="background:#2a2520;border:1px solid #3a352a"><p style="color:var(--amber);font-size:13px;font-weight:700;margin-bottom:6px">Form Check Tip</p><p style="color:var(--muted);font-size:13px;line-height:1.5">For each exercise, search YouTube for "[exercise name] kettlebell form" and watch 2-3 videos before your first session. Dan John, Pavel Tsatsouline, and StrongFirst channels are gold standard references.</p></div>`;
  html+=`</div>`;

  document.getElementById('app').innerHTML=html;
}

// Init
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();
</script>
</body>
</html>
